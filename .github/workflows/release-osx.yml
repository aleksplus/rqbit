name: Release binaries for OSX

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  # Must match the `wasm-bindgen` crate version in Cargo.lock (see Makefile).
  WASM_BINDGEN_VERSION: 0.2.127

jobs:
  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      # The GPUI web stack needs nightly: gpui-pre-web's `multithreaded`
      # feature pulls wasm_thread, which uses `#![feature(...)]` with no
      # opt-out (see Makefile, WASM_TOOLCHAIN).
      - name: Install nightly toolchain for the wasm web client
        run: rustup toolchain install nightly --profile minimal --target wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"

      # The browser client is embedded into the desktop binary at compile
      # time (app-daemon/build.rs), so this must run before desktop-gpui.
      - name: Build web client (wasm payload)
        run: |
          rustup run nightly cargo build -p web-gpui --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir web-gpui/dist/pkg target/wasm32-unknown-unknown/release/web_gpui.wasm

      - name: Build release OSX universal binary (desktop-gpui)
        run: |
          cargo build -p desktop-gpui --profile release-github --target x86_64-apple-darwin
          cargo build -p desktop-gpui --profile release-github --target aarch64-apple-darwin

      # No `webui` feature: the legacy React web UI requires an npm build and
      # is superseded by the embedded web client above.
      - name: Build release OSX universal binary (rqbit CLI)
        run: |
          cargo build -p rqbit --profile release-github --no-default-features --features default-tls,postgres,prometheus --target x86_64-apple-darwin
          cargo build -p rqbit --profile release-github --no-default-features --features default-tls,postgres,prometheus --target aarch64-apple-darwin

      # All artifacts land in the workspace-root target/ (desktop-gpui and
      # rqbit are workspace members), even when built with -p.
      - name: Create universal binaries
        run: |
          mkdir -p target/artifacts
          lipo target/x86_64-apple-darwin/release-github/desktop-gpui target/aarch64-apple-darwin/release-github/desktop-gpui -create -output target/artifacts/desktop-gpui-osx-universal
          lipo target/x86_64-apple-darwin/release-github/rqbit target/aarch64-apple-darwin/release-github/rqbit -create -output target/artifacts/rqbit-osx-universal

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: true
          files: |
            target/artifacts/desktop-gpui-osx-universal
            target/artifacts/rqbit-osx-universal
