name: Release binaries for OSX

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make a directory for output artifacts
        run: mkdir -p target/artifacts

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin && rustup target add x86_64-apple-darwin

      - name: Build release OSX universal binary (CLI)
        run: |
          cargo build --profile release-github --target x86_64-apple-darwin
          cargo build --profile release-github --target aarch64-apple-darwin
          lipo ./target/x86_64-apple-darwin/release-github/rqbit ./target/aarch64-apple-darwin/release-github/rqbit -create -output ./target/artifacts/rqbit-osx-universal

      - name: Build release OSX universal binary (desktop-gpui)
        working-directory: desktop-gpui
        run: |
          cargo build --profile release-github --target x86_64-apple-darwin
          cargo build --profile release-github --target aarch64-apple-darwin
          lipo ./target/x86_64-apple-darwin/release-github/desktop-gpui ./target/aarch64-apple-darwin/release-github/desktop-gpui -create -output ../target/artifacts/desktop-gpui-osx-universal

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: true
          files: |
            target/artifacts/rqbit-osx-universal
            target/artifacts/desktop-gpui-osx-universal
