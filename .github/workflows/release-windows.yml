name: Release binaries for Windows

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No `webui` feature: the legacy React web UI requires an npm build and
      # is superseded by the web client embedded in the desktop app.
      - name: Build release (rqbit CLI)
        run: cargo build -p rqbit --profile release-github --no-default-features --features default-tls,postgres,prometheus

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: true
          files: |
            target/release-github/rqbit.exe
