[package]
name = "desktop-gpui"
version = "9.0.0-rc.0"
edition = "2024"
description = "Shared desktop logic for rqbit (used by Tauri and GPUI front‑ends)"
license = "MIT"
repository = "https://github.com/anthropics/rqbit"
publish = false

[dependencies]
gpui.workspace = true
gpui_http_client.workspace = true
url.workspace = true
librqbit = { workspace = true, features = [
    "tracing-subscriber-utils",
    "http-api",
    "webui",
    "upnp-serve-adapter",
    "prometheus",
    "default-tls"
] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
anyhow = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
directories = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
parking_lot = { workspace = true }
gethostname = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
librqbit-dualstack-sockets = { workspace = true }
ring = "0.17"
hex = "0.4"
toml = "0.8"

[features]
default = []
upnp = ["librqbit/upnp-serve-adapter"]
