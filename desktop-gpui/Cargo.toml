[package]
name = "desktop-gpui"
version.workspace = true
edition = "2024"
description = "Native desktop for rqbit"
license = "MIT"
repository = "https://github.com/anthropics/rqbit"
publish = false

[package.metadata.bundle]
name = "rqbit-gpui-desktop"
identifier = "com.rqbit.gpui-desktop"
icon = ["icons/icon.ico", "icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns"]
version = "1.0.0"
short_description = "Native desktop for rqbit"
long_description = """https://github.com/aleksplus/rqbit"""

[dependencies]
# gpui-kit pins the matching GPUI release (gpui-pre); the aliases below must
# stay on the same exact versions as gpui-kit or the GPUI types would split.
gpui-kit = "0.7.1"
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
url.workspace = true
librqbit = { workspace = true, features = [
    "tracing-subscriber-utils",
    "http-api",
    "webui",
    "upnp-serve-adapter",
    "prometheus",
    "default-tls"
] }
librqbit-core = { workspace = true, features = ["sha1-crypto-hash"] }
notify = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["json", "query"] }
base64 = { workspace = true }
http = { workspace = true }
directories = { workspace = true }
futures = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
parking_lot = { workspace = true }
gethostname = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
librqbit-dualstack-sockets = { workspace = true }
walkdir = { workspace = true }
ring = "0.17"
hex = "0.4"
toml = "0.8"

[dev-dependencies]
# Headless UI tests (gpui_kit::test) need the kit's test-support feature.
gpui-kit = { version = "0.7.1", features = ["test-support"] }

[features]
default = []
disable-upload = ["librqbit/disable-upload"]