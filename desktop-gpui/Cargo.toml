[package]
name = "desktop-gpui"
version.workspace = true
edition = "2024"
description = "Native desktop for rqbit"
license = "MIT"
repository = "https://github.com/anthropics/rqbit"
publish = false

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "c36b0c6a" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "c36b0c6a" }
url.workspace = true
librqbit = { workspace = true, features = [
    "tracing-subscriber-utils",
    "upnp-serve-adapter",
    "prometheus",
    "default-tls"
] }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
directories = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
parking_lot = { workspace = true }
gethostname = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
librqbit-dualstack-sockets = { workspace = true }
ring = "0.17"
hex = "0.4"
toml = "0.8"

[features]
default = []
disable-upload = ["librqbit/disable-upload"]